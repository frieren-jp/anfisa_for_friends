{% extends 'base.html' %}
{% block title %}Вход | Анфиса для друзей{% endblock %}
{% block content %}
<div style="max-width: 420px; margin: 0 auto;">
  <h1 class="h3 mb-4">Вход</h1>
  <form method="post">
    {% csrf_token %}
    {% if form.errors %}<p role="alert" class="text-danger">Проверьте логин и пароль.</p>{% endif %}
    <div class="form-group">
      <label for="id_username">Логин</label>
      <input class="form-control" id="id_username" name="username" autocomplete="username" maxlength="150" value="{{ form.username.value|default:'' }}" required autofocus>
    </div>
    <div class="form-group">
      <label for="id_password">Пароль</label>
      <input class="form-control" id="id_password" name="password" type="password" autocomplete="current-password" required>
    </div>
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit" class="btn btn-primary">Войти</button>
  </form>
</div>
{% endblock %}
